[workspace]
resolver = "2"
members = ["core", "contract"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OWNER/veilprocure" # TODO: set once the human publishes the repo

[workspace.dependencies]
borsh = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
